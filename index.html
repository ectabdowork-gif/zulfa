<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>زلفى — تصفح الكتيب</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{ --ink:#f6f2ec; --muted:rgba(246,242,236,.7); --glass:rgba(24,24,22,.42); --green:#1f6b43; }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%; background:#1d1b1c; overflow:hidden}
  body{font-family:"IBM Plex Sans Arabic",system-ui,sans-serif; color:var(--ink); user-select:none; -webkit-user-select:none}
  canvas{display:block; touch-action:none}
  body::after{content:""; position:fixed; inset:0; pointer-events:none; z-index:2;
    background:radial-gradient(130% 100% at 50% 45%, transparent 55%, rgba(30,28,25,.28) 100%)}
  canvas.grab{cursor:grab} canvas.grabbing{cursor:grabbing}

  .loader{position:fixed; inset:0; display:grid; place-items:center; background:#1d1b1c; color:#f4f3f1; z-index:20; transition:opacity 1.2s ease}
  .loader div{display:flex; flex-direction:column; align-items:center; gap:14px; font-size:14px; letter-spacing:.02em}
  .loader i{width:140px; height:2px; background:rgba(0,0,0,.08); position:relative; overflow:hidden; border-radius:2px}
  .loader i::after{content:""; position:absolute; inset:0; width:40%; background:var(--green); animation:ld 1.1s ease-in-out infinite}
  @keyframes ld{from{transform:translateX(-120%)}to{transform:translateX(320%)}}

  .bar{position:fixed; left:50%; bottom:18px; transform:translate(-50%,20px); display:flex; align-items:center; gap:14px;
       padding:8px 12px; border-radius:999px; background:var(--glass); backdrop-filter:blur(14px) saturate(1.2); -webkit-backdrop-filter:blur(14px);
       box-shadow:0 8px 30px rgba(0,0,0,.18); opacity:0; pointer-events:none; transition:opacity .9s ease, transform .9s ease; font-size:14px; z-index:5}
  .bar.on{opacity:1; transform:translate(-50%,0); pointer-events:auto}
  .btn{width:38px; height:38px; border-radius:50%; border:0; background:rgba(255,255,255,.08); color:var(--ink); display:grid; place-items:center; cursor:pointer; transition:background .25s, opacity .25s}
  .btn:hover{background:rgba(255,255,255,.2)}
  .btn:disabled{opacity:.3; cursor:default; background:transparent}
  .btn svg{width:17px; height:17px}
  .count{min-width:118px; text-align:center; font-variant-numeric:tabular-nums}
  input[type=range]{width:min(260px,32vw); accent-color:#fff; direction:rtl}
  .skip{position:fixed; bottom:24px; left:24px; z-index:6; border:0; cursor:pointer; font:inherit; font-size:13px; color:#fff;
        background:rgba(0,0,0,.28); backdrop-filter:blur(10px); padding:8px 16px; border-radius:999px; transition:opacity .6s}
  .zoom{position:fixed; right:18px; top:50%; transform:translate(20px,-50%); display:flex; flex-direction:column; gap:8px; padding:8px;
        border-radius:999px; background:var(--glass); backdrop-filter:blur(14px) saturate(1.2); -webkit-backdrop-filter:blur(14px);
        box-shadow:0 8px 30px rgba(0,0,0,.18); opacity:0; pointer-events:none; transition:opacity .9s ease, transform .9s ease; z-index:5}
  .zoom.on{opacity:1; transform:translate(0,-50%); pointer-events:auto}
  .zoom .off{opacity:.35}
  .hint{position:fixed; top:18px; left:50%; transform:translateX(-50%); font-size:13px; color:#fff; background:rgba(0,0,0,.3);
        backdrop-filter:blur(10px); padding:6px 14px; border-radius:999px; opacity:0; transition:opacity 1s; pointer-events:none; z-index:5}
  @media (max-width:620px){ input[type=range]{display:none} .bar{gap:8px} .count{min-width:96px; font-size:13px} }
  @media (max-width:560px), (max-height:560px){
    .bar{bottom:6px; padding:3px 6px; gap:8px; font-size:12px}
    .btn{width:30px; height:30px} .btn svg{width:14px; height:14px}
    .count{min-width:88px; font-size:12px}
    input[type=range]{width:min(200px,26vw)}
    .hint{top:8px; font-size:12px}
    .zoom{right:8px; padding:4px; gap:4px}
  }
</style>
</head>
<body>
<div class="loader" id="loader"><div><span>زُلفى</span><i></i></div></div>
<div class="hint" id="hint">اسحب طرف الصفحة أو اضغط عليها للتقليب</div>
<div class="zoom" id="zoom">
  <button class="btn" id="zin" title="تكبير" aria-label="تكبير"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
  <button class="btn" id="zfit" title="ملء الإطار" aria-label="ملء الإطار"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 12h16M8 8l-4 4 4 4M16 8l4 4-4 4"/></svg></button>
  <button class="btn" id="zout" title="تصغير" aria-label="تصغير"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14"/></svg></button>
</div>
<div class="bar" id="bar">
  <button class="btn" id="fs" title="ملء الشاشة" aria-label="ملء الشاشة"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
  <button class="btn" id="prev" title="السابق" aria-label="السابق"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg></button>
  <span class="count" id="count">الغلاف</span>
  <input type="range" id="seek" min="0" value="0" aria-label="الانتقال إلى صفحة">
  <button class="btn" id="next" title="التالي" aria-label="التالي"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 6l-6 6 6 6"/></svg></button>
</div>

<script src="pages-a.js" defer></script>
<script src="pages-b.js" defer></script>
<script src="table.js" defer></script>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';

/* ================= constants ================= */
const PAGES = PAGE_DATA.length, N = PAGES / 2;   // leaf k: front = page 2k+1, back = page 2k+2
const T = 0.0011;            // paper thickness (1 unit = one page width)
const SPINE_Y = 0.003;
const GUT = 0.07;            // how far from the spine the pages rise out of the gutter
const SU = 56, SV = 28;      // leaf mesh resolution

/* ================= renderer / scene ================= */
const renderer = new THREE.WebGLRenderer({antialias: true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.NoToneMapping;          // keep the printed colours untouched
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.prepend(renderer.domElement);
const MAX_ANISO = renderer.capabilities.getMaxAnisotropy();

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1d1b1c);
const camera = new THREE.PerspectiveCamera(32, innerWidth / innerHeight, 0.02, 80);

function canvasTex(w, h, draw, srgb = true){
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  if (srgb) t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = MAX_ANISO;
  return t;
}
const rnd = (a, b) => a + Math.random() * (b - a);


/* ================= lights =================
   Ambient + sun are balanced so a flat page facing up renders at exactly its printed colour
   ((AMB + SUN·cos) / PI = 1). Anything that bends away from the sun or sits in a shadow darkens. */
const SUN_DIR = new THREE.Vector3(-.75, 1, -.3).normalize();   // from the desk lamp, top-left
const AMB = .6 * Math.PI;
scene.add(new THREE.AmbientLight(0xffffff, AMB));
const sun = new THREE.DirectionalLight(0xffffff, (Math.PI - AMB) / SUN_DIR.y);
sun.position.copy(SUN_DIR).multiplyScalar(12);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, {left: -3, right: 3, top: 3, bottom: -3, near: 4, far: 24});
sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.01; sun.shadow.radius = 5;
scene.add(sun, sun.target);

/* ================= table + props ================= */
function box(w, h, d, mat, x, y, z, cast = false, recv = true){
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.position.set(x, y, z); m.castShadow = cast; m.receiveShadow = recv; scene.add(m); return m;
}
// the desk: a top-down photo laid flat. The lamp sits just past the book's left edge,
// the book lies in its pool of light.
const TABLE_W = 4.6, TABLE_H = TABLE_W * 1440 / 2560;
const deskImg = new Image(); deskImg.src = TABLE_IMG;
const deskTex = new THREE.Texture(deskImg);
deskTex.colorSpace = THREE.SRGBColorSpace; deskTex.anisotropy = MAX_ANISO;
deskImg.onload = () => { deskTex.needsUpdate = true; };
const desk = new THREE.Mesh(new THREE.PlaneGeometry(TABLE_W, TABLE_H), new THREE.MeshLambertMaterial({map: deskTex}));
desk.rotation.x = -Math.PI / 2; desk.position.set(.234, 0, 0); desk.receiveShadow = true; scene.add(desk);

// soft contact shadow under each half of the book (ambient occlusion on the table)
const contactTex = canvasTex(256, 256, (g, w, h) => {
  g.filter = 'blur(14px)'; g.fillStyle = 'rgba(0,0,0,.55)'; g.fillRect(30, 30, w - 60, h - 60);
});
const contact = [-1, 1].map(s => {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(1.22, 1.22), new THREE.MeshBasicMaterial({map: contactTex, transparent: true, depthWrite: false}));
  m.rotation.x = -Math.PI / 2; m.position.set(s * .5, .0008, .01); scene.add(m); return m;
});
function updateContact(){ contact[0].visible = flipped < N; contact[1].visible = flipped > 0; }


/* ================= book ================= */
const placeholder = new THREE.DataTexture(new Uint8Array([255, 255, 255, 255]), 1, 1); placeholder.needsUpdate = true;
const edgeMat = new THREE.MeshLambertMaterial({color: 0xeeebe5});
const blockL = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1), edgeMat);
const blockR = blockL.clone();
for (const b of [blockL, blockR]) { b.castShadow = true; b.receiveShadow = true; scene.add(b); }

function leafGeometry(){
  const nu = SU + 1, nv = SV + 1, uv = new Float32Array(nu * nv * 2), idx = [];
  for (let j = 0; j < nv; j++) for (let i = 0; i < nu; i++) {
    const n = j * nu + i; uv[n * 2] = 1 - i / SU; uv[n * 2 + 1] = 1 - j / SV;
  }
  for (let j = 0; j < SV; j++) for (let i = 0; i < SU; i++) {
    const a = j * nu + i, b = a + 1, c = a + nu, d = c + 1;
    idx.push(a, b, c, b, d, c);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(nu * nv * 3), 3));
  g.setAttribute('uv', new THREE.BufferAttribute(uv, 2));
  g.setIndex(idx);
  return g;
}

/* Paper: Lambert (no sheen) plus a shadow that deepens into the gutter where the pages meet the spine. */
function paperMaterial(side, gutter){
  const m = new THREE.MeshLambertMaterial({map: placeholder, side});
  const uGutter = {value: gutter};
  m.onBeforeCompile = sh => {
    sh.uniforms.uGutter = uGutter;
    sh.vertexShader = sh.vertexShader
      .replace('#include <common>', '#include <common>\nvarying float vSpine;')
      .replace('#include <uv_vertex>', '#include <uv_vertex>\nvSpine = 1.0 - uv.x;');
    sh.fragmentShader = sh.fragmentShader
      .replace('#include <common>', '#include <common>\nvarying float vSpine;\nuniform float uGutter;')
      .replace('#include <map_fragment>', `#include <map_fragment>
        float gut = 1.0 - uGutter * (0.38 * exp(-vSpine / 0.018) + 0.17 * exp(-vSpine / 0.075) + 0.05 * exp(-vSpine / 0.3));
        float edge = 1.0 - uGutter * 0.06 * exp(-(1.0 - vSpine) / 0.008);
        diffuseColor.rgb *= gut * edge;`);
  };
  return m;
}

const leaves = [];
for (let k = 0; k < N; k++) {
  const geo = leafGeometry();
  const fm = paperMaterial(THREE.FrontSide, k === 0 ? .2 : 1);
  const bm = paperMaterial(THREE.BackSide, k === N - 1 ? .2 : 1);
  const front = new THREE.Mesh(geo, fm), back = new THREE.Mesh(geo, bm);
  front.receiveShadow = back.receiveShadow = true;
  scene.add(front, back);
  leaves.push({k, geo, front, back, fm, bm, theta: 0, stiff: k === 0 || k === N - 1, tex: null});
}

/* Paper shape. theta = angle at the spine (0 = lying on the left, PI = on the right).
   The sheet bends along its width (free edge lags behind the spine), twists so one corner
   leads, and near the spine it rises out of the gutter to sit on its own layer of the stack. */
function shapeLeaf(L, theta, dir = 1, lead = 1){
  L.theta = theta;
  const p = L.geo.attributes.position.array;
  const s = Math.sin(theta);
  const A = L.stiff ? .22 : 1.05, B = L.stiff ? .1 : .5;
  const hL = (N - L.k) * T, hR = (L.k + 1) * T;
  const h = hL + (hR - hL) * (theta / Math.PI), cg = Math.abs(Math.cos(theta));
  const du = 1 / SU, nu = SU + 1;
  for (let j = 0; j <= SV; j++) {
    const v = -.5 + j / SV;
    let X = 0, Y = SPINE_Y;
    for (let i = 0; i <= SU; i++) {
      const u = i * du;
      if (i > 0) {
        const um = u - du / 2;
        let phi = theta - dir * A * s * Math.pow(um, 1.6) + dir * B * s * um * v * 2 * lead;
        phi = Math.min(Math.PI, Math.max(0, phi));
        X -= Math.cos(phi) * du; Y += Math.sin(phi) * du;
      }
      const o = (j * nu + i) * 3;
      p[o] = X; p[o + 1] = Y + h * (1 - Math.exp(-u / GUT)) * cg; p[o + 2] = v;
    }
  }
  L.geo.attributes.position.needsUpdate = true;
  L.geo.computeVertexNormals();
  L.geo.computeBoundingSphere();
}

function pageTexture(n, mirror){
  const img = new Image();
  const t = new THREE.Texture(img);
  t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = MAX_ANISO;
  if (mirror) { t.repeat.x = -1; t.offset.x = 1; }
  img.onload = () => { t.needsUpdate = true; };
  img.src = PAGE_DATA[n - 1];
  return t;
}
function loadLeaf(k){
  const L = leaves[k]; if (!L || L.tex) return;
  L.tex = [pageTexture(2 * k + 1, false), pageTexture(2 * k + 2, true)];
  L.fm.map = L.tex[0]; L.bm.map = L.tex[1];
}
function unloadFar(){
  for (const L of leaves) if (L.tex && Math.abs(L.k - flipped) > 5) {
    L.tex.forEach(t => t.dispose()); L.tex = null; L.fm.map = L.bm.map = placeholder;
  }
}
function prepare(){ for (let k = flipped - 3; k <= flipped + 3; k++) loadLeaf(k); unloadFar(); }

let flipped = 0;
function updateBlocks(){
  const nl = N - flipped, nr = flipped;
  const set = (b, n, x) => {
    b.visible = n > 1;
    const hgt = Math.max(.0001, (n - 2) * T);
    b.scale.set(.63, hgt, .994); b.position.set(x, hgt / 2, 0);
  };
  set(blockL, nl, -.67); set(blockR, nr, .67);
}
leaves.forEach(L => shapeLeaf(L, 0));
updateBlocks(); updateContact(); prepare();

/* ================= flipping ================= */
const ease = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
let anim = null, queued = 0;

function startAnim(L, to, dir, lead, dur){
  const from = L.theta;
  dur = dur ?? 1150 * Math.max(.4, Math.abs(to - from) / Math.PI);
  anim = {L, from, to, dir, lead, t0: performance.now(), dur};
  L.front.castShadow = true;
}
function stepAnim(now){
  if (!anim) return;
  const a = anim, t = Math.min(1, (now - a.t0) / a.dur);
  shapeLeaf(a.L, a.from + (a.to - a.from) * ease(t), a.dir, a.lead);
  if (t >= 1) {
    a.L.front.castShadow = false; anim = null; updateBlocks(); updateContact(); unloadFar();
    if (queued) { const q = queued; queued = 0; turn(q); }
  }
}
function turn(dir){
  if (!ready) return;
  if (anim || drag?.moved) { queued = dir; return; }
  if (dir > 0 && flipped >= N) return;
  if (dir < 0 && flipped <= 0) return;
  const L = leaves[dir > 0 ? flipped : flipped - 1];
  flipped += dir; prepare(); ui(); hideHint(); updateContact();
  startAnim(L, dir > 0 ? Math.PI : 0, dir, 1);
}
function goTo(target){
  target = Math.max(0, Math.min(N, target));
  if (anim || target === flipped) return;
  const dir = target > flipped ? 1 : -1;
  while (Math.abs(target - flipped) > 1) {
    shapeLeaf(leaves[dir > 0 ? flipped : flipped - 1], dir > 0 ? Math.PI : 0);
    flipped += dir;
  }
  updateBlocks(); turn(dir);
}

/* ================= camera ================= */
const camPos = new THREE.Vector3(), camLook = new THREE.Vector3();
function readingView(){
  const a = innerWidth / innerHeight, tn = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
  // the book fills the screen height (the bar floats over it); on narrow screens its width decides
  // closed (front or back cover): pull back to show the whole desk; opening the book zooms in
  if (flipped === 0 || flipped === N) {
    const H = Math.max(TABLE_H / (2 * tn), TABLE_W / (2 * tn * a)) / zoom;
    pan.set(0, 0);
    return {pos: new THREE.Vector3(desk.position.x, H, 0), look: new THREE.Vector3(desk.position.x, 0, 0)};
  }
  // zoom = 1 is that fit; zooming in lets the viewer pan around within the book
  const H = Math.max(1.02 / (2 * tn), 2.04 / (2 * tn * a)) / zoom;
  const cx = flipped === 0 ? -.5 : flipped === N ? .5 : 0, halfW = flipped === 0 || flipped === N ? .5 : 1;
  const px = Math.max(0, halfW - H * tn * a), pz = Math.max(0, .5 - H * tn);
  pan.x = Math.max(-px, Math.min(px, pan.x)); pan.y = Math.max(-pz, Math.min(pz, pan.y));
  // straight down, no tilt: screen-up is the top edge of the pages (-z)
  return {pos: new THREE.Vector3(cx + pan.x, H, pan.y), look: new THREE.Vector3(cx + pan.x, 0, pan.y)};
}
let zoom = 1;
const pan = new THREE.Vector2();
const ZMIN = .6, ZMAX = 3.5;
function setZoom(z){
  zoom = Math.max(ZMIN, Math.min(ZMAX, z));
  if (zoom <= 1) pan.set(0, 0);
  document.getElementById('zin').disabled = zoom >= ZMAX;
  document.getElementById('zout').disabled = zoom <= ZMIN;
  document.getElementById('zfit').classList.toggle('off', Math.abs(zoom - 1) < .01);
}
camera.up.set(0, 0, -1);
let ready = false;
function updateCamera(now, dt){
  const v = readingView(), k = 1 - Math.exp(-dt * 2.4);
  camera.position.lerp(v.pos, k); camLook.lerp(v.look, k); camera.lookAt(camLook);
}

/* ================= input ================= */
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2(), table0 = new THREE.Plane(new THREE.Vector3(0, 1, 0), -.01);
function hit(e){
  ndc.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  return ray.ray.intersectPlane(table0, new THREE.Vector3());
}
let drag = null;
const cv = renderer.domElement;
cv.addEventListener('pointerdown', e => {
  if (!ready) return;
  if (zoom > 1.02) {                        // zoomed in: drag pans, a plain click still turns the page
    const p = hit(e);
    drag = {pan: true, x0: e.clientX, y0: e.clientY, px: pan.x, py: pan.y, moved: false, left: p ? p.x < 0 : true};
    cv.setPointerCapture(e.pointerId); return;
  }
  if (anim) return;
  const p = hit(e); if (!p || Math.abs(p.z) > .55 || Math.abs(p.x) > 1.05) return;
  const left = p.x < 0;
  if (left && flipped >= N) return;
  if (!left && flipped <= 0) return;
  drag = {x0: e.clientX, y0: e.clientY, left, moved: false, L: leaves[left ? flipped : flipped - 1],
          lead: Math.max(-1, Math.min(1, p.z * 2)) || .001, v: 0, last: p.x, t: performance.now()};
  cv.setPointerCapture(e.pointerId);
});
cv.addEventListener('pointermove', e => {
  if (!drag) return;
  if (!drag.moved && Math.hypot(e.clientX - drag.x0, e.clientY - drag.y0) < 6) return;
  if (drag.pan) {
    drag.moved = true; cv.classList.add('grabbing');
    const wpp = 2 * camera.position.y * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)) / innerHeight;
    pan.set(drag.px - (e.clientX - drag.x0) * wpp, drag.py - (e.clientY - drag.y0) * wpp);
    return;
  }
  const p = hit(e); if (!p) return;
  if (!drag.moved) { drag.moved = true; cv.classList.add('grabbing'); loadLeaf(drag.L.k + 1); loadLeaf(drag.L.k - 1); drag.L.front.castShadow = true; hideHint(); }
  const now = performance.now();
  drag.v = (p.x - drag.last) / Math.max(1, now - drag.t) * 1000; drag.last = p.x; drag.t = now;
  const c = Math.max(-1, Math.min(1, -p.x));
  const theta = Math.acos(c);
  shapeLeaf(drag.L, theta, drag.left ? 1 : -1, drag.lead * (drag.left ? 1 : -1) * 1.4);
});
function endDrag(){
  if (!drag) return;
  const d = drag; drag = null; cv.classList.remove('grabbing');
  if (!d.moved) { turn(d.left ? 1 : -1); return; }
  if (d.pan) return;
  const forward = d.v > 1.2 ? true : d.v < -1.2 ? false : d.L.theta > Math.PI / 2;
  if (d.left && forward) flipped++;
  if (!d.left && !forward) flipped--;
  prepare(); ui(); updateContact();
  startAnim(d.L, forward ? Math.PI : 0, forward ? 1 : -1, d.lead * (forward ? 1 : -1) * 1.4);
}
cv.addEventListener('pointerup', endDrag);
cv.addEventListener('pointercancel', endDrag);

document.getElementById('zin').onclick = () => setZoom(zoom * 1.25);
document.getElementById('zout').onclick = () => setZoom(zoom / 1.25);
document.getElementById('zfit').onclick = () => setZoom(1);
cv.addEventListener('wheel', e => { if (!ready) return; e.preventDefault(); setZoom(zoom * Math.exp(-e.deltaY * .0015)); }, {passive: false});
// two-finger pinch on touch screens
const touches = new Map(); let pinch0 = null;
cv.addEventListener('pointerdown', e => { if (e.pointerType === 'touch') touches.set(e.pointerId, e); if (touches.size === 2) { const [a, b] = [...touches.values()]; pinch0 = {d: Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY), z: zoom}; drag = null; } });
cv.addEventListener('pointermove', e => {
  if (!touches.has(e.pointerId)) return; touches.set(e.pointerId, e);
  if (pinch0 && touches.size === 2) { const [a, b] = [...touches.values()]; setZoom(pinch0.z * Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY) / pinch0.d); }
});
const untouch = e => { touches.delete(e.pointerId); if (touches.size < 2) pinch0 = null; };
cv.addEventListener('pointerup', untouch); cv.addEventListener('pointercancel', untouch);
setZoom(1);
document.getElementById('next').onclick = () => turn(1);
document.getElementById('prev').onclick = () => turn(-1);
const seek = document.getElementById('seek'); seek.max = N;
seek.addEventListener('change', () => goTo(+seek.value));
addEventListener('keydown', e => {
  if (!ready) return;
  if (e.key === 'ArrowLeft' || e.key === 'PageDown' || e.key === ' ') { e.preventDefault(); turn(1); }
  if (e.key === 'ArrowRight' || e.key === 'PageUp') { e.preventDefault(); turn(-1); }
  if (e.key === 'Home') goTo(0);
  if (e.key === 'End') goTo(N);
  if (e.key === '+' || e.key === '=') setZoom(zoom * 1.25);
  if (e.key === '-') setZoom(zoom / 1.25);
  if (e.key === '0') setZoom(1);
});
document.getElementById('fs').onclick = () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen?.();
let hintHidden = false;
function hideHint(){ if (!hintHidden) { hintHidden = true; document.getElementById('hint').style.opacity = 0; } }

function ui(){
  document.getElementById('prev').disabled = flipped === 0;
  document.getElementById('next').disabled = flipped === N;
  seek.value = flipped;
  document.getElementById('count').textContent =
    flipped === 0 ? 'الغلاف' : flipped === N ? 'الغلاف الخلفي' : `${2 * flipped} و ${2 * flipped + 1} من ${PAGES}`;
}
ui();

addEventListener('resize', () => {
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
});

/* ================= loop ================= */
let last = performance.now();
function frame(now){
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  stepAnim(now);
  updateCamera(now, dt);
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}

// start low and oblique, then glide up into the reading view
{ const v = readingView(); camLook.copy(v.look);
  camera.position.set(v.pos.x + .4, v.pos.y * .55, v.look.z + v.pos.y * 1.05); camera.lookAt(camLook); }
renderer.compile(scene, camera);
Promise.all(leaves.slice(0, 3).flatMap(L => L.tex.map(t => t.image.decode().catch(() => {})))).then(() => {
  requestAnimationFrame(frame);
  const l = document.getElementById('loader');
  setTimeout(() => {
    l.style.opacity = 0; setTimeout(() => l.remove(), 1300);
    ready = true; renderer.domElement.classList.add('grab');
    document.getElementById('bar').classList.add('on'); document.getElementById('zoom').classList.add('on');
    const h = document.getElementById('hint'); h.style.opacity = 1; setTimeout(hideHint, 5000);
  }, 250);
});
</script>
</body>
